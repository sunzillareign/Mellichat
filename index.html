<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>Mellichat</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --violet:#7C3AED; --violet-d:#5B21B6; --violet-l:#A78BFA; --lilac:#F1ECFE; --mist:#F8F6FD;
  --ink:#1E1433; --mute:#7A7194; --line:#E9E4F3; --white:#fff;
  --online:#22C55E; --away:#FACC15; --offline:#9CA3AF;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* GLOBAL LEVEL UPGRADE: UNLOCK FULL SELECTION AND TEXT COPYING CAPABILITIES */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select: text !important;
  -webkit-user-select: text !important;
  -moz-user-select: text !important;
  -ms-user-select: text !important;
}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:#ECE7F7;display:flex;justify-content:center;align-items:center;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet-l);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#shell{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--white);overflow:hidden}
@media (min-width:500px){#shell{height:min(860px,calc(100dvh - 32px));border-radius:32px;box-shadow:0 30px 80px -20px rgba(76,29,149,.45)}}

/* ---------- boot splash ---------- */
#boot{position:absolute;inset:0;z-index:60;background:linear-gradient(165deg,#4C1D95 0%,#7C3AED 55%,#A78BFA 100%);display:grid;place-items:center}
#boot .logo{margin:0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- auth ---------- */
#auth{position:absolute;inset:0;background:linear-gradient(165deg,#4C1D95 0%,#7C3AED 55%,#A78BFA 100%);display:flex;flex-direction:column;z-index:20;overflow:hidden}
#auth .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:drift 14s ease-in-out infinite}
#auth .orb:nth-child(1){width:180px;height:180px;left:-50px;top:40px}
#auth .orb:nth-child(2){width:90px;height:90px;right:30px;top:90px;animation-duration:10s;animation-delay:-3s}
#auth .orb:nth-child(3){width:130px;height:130px;right:-40px;top:230px;animation-duration:17s;animation-delay:-7s}
#auth .orb:nth-child(4){width:50px;height:50px;left:40%;top:30px;animation-duration:9s;animation-delay:-5s;background:rgba(255,255,255,.2)}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(18px,-26px)}66%{transform:translate(-14px,16px)}}
.hero{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:center;padding:28px 28px 8px;color:#fff;position:relative}
.logo{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 12px 30px -8px rgba(30,20,51,.5);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.hero h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.02em}
.hero p{margin-top:10px;opacity:.88;max-width:28ch;line-height:1.4}
.sheet{background:#fff;border-radius:30px 30px 0 0;padding:20px 22px calc(22px + env(safe-area-inset-bottom));position:relative;animation:rise .7s .15s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 -20px 50px -20px rgba(30,20,51,.4);max-height:80%;overflow-y:auto}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--lilac);border-radius:14px;padding:4px;margin-bottom:16px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:11px;box-shadow:0 2px 8px rgba(91,33,182,.18);transition:transform .3s cubic-bezier(.3,1.2,.4,1)}
.seg.in .thumb{transform:translateX(100%)}
.seg button{position:relative;padding:10px;font-weight:700;color:var(--mute);transition:color .2s;width:100%}
.seg button.on{color:var(--violet-d)}
.fld{display:block;margin-bottom:12px;overflow:hidden;transition:max-height .35s ease,opacity .25s,margin .35s;max-height:90px}
.fld.collapse{max-height:0;opacity:0;margin-bottom:0}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:5px}
.fld input,.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--mist);outline:0;transition:border .2s,background .2s}
.fld input:focus,.inp:focus{border-color:var(--violet);background:#fff}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--violet);color:#fff;font-weight:700;font-size:16px;transition:transform .15s,background .2s;box-shadow:0 8px 20px -8px rgba(124,58,237,.8)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;display:flex;gap:10px;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12.5px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#DC2626;font-size:13.5px;min-height:18px;margin-bottom:8px}
.modehint{margin-top:12px;font-size:12px;color:var(--mute);text-align:center;line-height:1.4}
.setup{background:var(--lilac);border:1.5px solid var(--violet-l);color:var(--violet-d);border-radius:16px;padding:14px;margin-bottom:14px;font-size:13.5px;line-height:1.45}
.setup b{display:block;font-family:var(--display);font-size:16px;margin-bottom:4px}

/* ---------- app frame ---------- */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;flex:none}
.hd-user{display:flex;align-items:center;gap:11px;text-align:left}
.hd-user b{display:block;font-family:var(--display);font-size:16px;line-height:1.1}
.hd-user small{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);margin-top:2px}
.hd-user small i{width:8px;height:8px;border-radius:50%;background:var(--offline)}
.hd-user small.online i{background:var(--online)}.hd-user small.away i{background:var(--away)}
.brand{font-family:var(--display);font-weight:800;color:var(--violet);font-size:21px;letter-spacing:-.03em}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:20px 18px 24px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .22s,transform .22s}
.view.on{opacity:1;pointer-events:auto;transform:none}
.view h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin-bottom:14px}
.view h3{font-size:13.5px;font-weight:700;color:var(--mute);margin:20px 0 8px}

/* avatar */
.av{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;background:var(--violet-l);background-size:cover;background-position:center;overflow:hidden}
.av.sm{width:38px;height:38px;font-size:14px}.av.lg{width:92px;height:92px;font-size:34px;margin:0 auto 12px}

/* Feature Injections Layout Styles */
.msg-bubble audio{max-width:100%;margin-top:6px;display:block}
.doc-card{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);padding:8px 12px;border-radius:10px;margin-top:6px;color:inherit;text-decoration:none;font-weight:500;font-size:13.5px}
.input-bar-enhancements{display:flex;align-items:center;gap:6px;margin-right:4px}
.action-circle-btn{width:38px;height:38px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:18px;color:var(--violet)}
.rec-pulse-badge{color:#DC2626;font-size:12px;font-weight:bold;animation:pulse 1s infinite;margin-left:10px}
</style>

<!-- Firebase Legacy Core Architecture Modules -->

<body>

<div id="shell">
  <div id="boot"><div class="logo">💬</div></div>

  <!-- ---------- auth ---------- -->
  <div id="auth" hidden>
    <div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div>
    <div class="hero">
      <div class="logo">💬</div>
      <h1>Mellichat</h1>
      <p>Text free, stay close. Pick a username, find your friends and start talking.</p>
    </div>
    <div class="sheet">
      <div class="seg" id="authSeg">
        <div class="thumb"></div>
        <button class="on" id="btnTabLogin" onclick="setAuthMode('login')">Sign In</button>
        <button id="btnTabRegister" onclick="setAuthMode('register')">Sign Up</button>
      </div>
      <div class="err" id="authErr"></div>
      <div class="fld collapse" id="usernameFld">
        <span>Username</span>
        <input type="text" id="authUsername" placeholder="Letters, numbers or underscores" maxlength="15">
      </div>
      <div class="fld">
        <span>Email Address</span>
        <input type="email" id="authEmail" placeholder="e.g. name@gmail.com">
      </div>
      <div class="fld">
        <span>Password</span>
